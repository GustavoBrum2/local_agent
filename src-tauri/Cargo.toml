[package]
name = "pc-match-desktop"
version = "0.1.0"
description = "PC Match Desktop MVP"
authors = ["PC Match"]
edition = "2021"

[lib]
name = "pc_match_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
