[package]
name = "local-chat-desktop"
version = "0.1.0"
description = "Local Chat Desktop"
authors = ["Local Chat"]
edition = "2021"

[lib]
name = "local_chat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
